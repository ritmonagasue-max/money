<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファミリー残高</title>
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      width: 85%;
      max-width: 340px;
    }
    .label { font-size: 14px; color: #64748b; margin-bottom: 8px; }
    .balance { font-size: 40px; font-weight: bold; color: #0f172a; margin: 12px 0; }
    .time { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">ファミリー口座 残高</div>
    <div class="balance" id="balance">¥---,---</div>
    <div class="time" id="updatedAt">読み込み中...</div>
    <button class="btn" onclick="fetchBalance()">残高を更新</button>
  </div>

  <script>
    async function fetchBalance() {
      document.getElementById('updatedAt').innerText = '更新中...';
      setTimeout(() => {
        const dummyBalance = 1250000;
        document.getElementById('balance').innerText = '¥' + dummyBalance.toLocaleString();
        document.getElementById('updatedAt').innerText = '最終更新: ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
      }, 500);
    }
    window.onload = fetchBalance;
  </script>
</body>
</html>

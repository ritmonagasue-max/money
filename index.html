<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファミリー資産管理</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text-main: #0f172a;
      --text-sub: #64748b;
    }
    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .title {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 4px;
      text-align: center;
      font-weight: 600;
    }
    .total-balance {
      font-size: 32px;
      font-weight: bold;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 16px;
    }
    .section-label {
      font-size: 12px;
      font-weight: bold;
      color: var(--text-sub);
      margin: 10px 0 6px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid #e2e8f0;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .input-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .input-row label {
      font-size: 13px;
      font-weight: bold;
      color: #334155;
      width: 160px;
      white-space: nowrap;
    }
    .input-row input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      text-align: right;
      outline: none;
      width: 100%;
    }
    .input-row input:focus {
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .chart-box {
      position: relative;
      width: 100%;
      height: 250px;
      margin-top: 10px;
    }
    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 220px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      flex-direction: column;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .history-date { color: var(--text-sub); font-weight: 500; }
    .history-amount { font-weight: bold; color: var(--text-main); font-size: 15px; }
    .history-details {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
    }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
    }
    .del-btn { color: #ef4444; }
    .edit-btn { color: #2563eb; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title">総資産残高</div>
    <div class="total-balance" id="totalBalance">¥0</div>

    <div class="input-group">
      <!-- 現金カテゴリ -->
      <div class="section-label">💵 現金</div>
      <div class="input-row">
        <label style="color: #10b981;">現金手元・口座</label>
        <input type="number" id="cashInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #059669;">モリモリ買取</label>
        <input type="number" id="morimoriInput" placeholder="0" inputmode="numeric">
      </div>

      <!-- 証券カテゴリ -->
      <div class="section-label">📈 証券</div>
      <div class="input-row">
        <label style="color: #6366f1;">iDeCo</label>
        <input type="number" id="idecoInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #6366f1;">PayPay証券</label>
        <input type="number" id="paypayInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #6366f1;">マネックス証券</label>
        <input type="number" id="monexInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #6366f1;">三菱UFJ eスマ証券</label>
        <input type="number" id="mufgInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #6366f1;">その他証券</label>
        <input type="number" id="otherSecInput" placeholder="0" inputmode="numeric">
      </div>

      <!-- 暗号資産カテゴリ -->
      <div class="section-label">₿ 暗号資産</div>
      <div class="input-row">
        <label style="color: #f59e0b;">BTC (メルカリ)</label>
        <input type="number" id="btcMercariInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #f59e0b;">BTC (BITPOINT)</label>
        <input type="number" id="btcBitpointInput" placeholder="0" inputmode="numeric">
      </div>

      <!-- ポイントカテゴリ -->
      <div class="section-label">🎁 ポイント</div>
      <div class="input-row">
        <label style="color: #ec4899;">dポイント</label>
        <input type="number" id="dPointInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #ec4899;">dポイント運用</label>
        <input type="number" id="dPointInvestInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #ec4899;">Vポイント</label>
        <input type="number" id="vPointInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #ec4899;">Vポイント運用</label>
        <input type="number" id="vPointInvestInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #ec4899;">楽天期間限定pt</label>
        <input type="number" id="rakutenLimitedInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #ec4899;">Pontaポイント</label>
        <input type="number" id="pontaPointInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #ec4899;">Pontaポイント運用</label>
        <input type="number" id="pontaPointInvestInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #ec4899;">PayPayポイント運用</label>
        <input type="number" id="paypayPointInvestInput" placeholder="0" inputmode="numeric">
      </div>

      <div class="input-row" style="margin-top: 10px;">
        <label>📅 入力日</label>
        <input type="date" id="dateInput">
      </div>
    </div>

    <button class="btn" onclick="addRecord()">記録を保存・更新</button>
  </div>

  <div class="card">
    <div class="title">資産内訳（4大区分）</div>
    <div class="chart-box">
      <canvas id="pieChart"></canvas>
    </div>
  </div>

  <div class="card">
    <div class="title">総資産推移</div>
    <div class="chart-box">
      <canvas id="lineChart"></canvas>
    </div>
  </div>

  <div class="card">
    <div class="title" style="margin-bottom: 12px;">入力履歴</div>
    <ul class="history-list" id="historyList"></ul>
  </div>
</div>

<script>
  let records = JSON.parse(localStorage.getItem('family_money_records') || '[]');
  let pieChart, lineChart;

  const INPUT_IDS = [
    'cashInput', 'morimoriInput', 'idecoInput', 'paypayInput', 'monexInput', 'mufgInput', 'otherSecInput',
    'btcMercariInput', 'btcBitpointInput',
    'dPointInput', 'dPointInvestInput', 'vPointInput', 'vPointInvestInput', 'rakutenLimitedInput',
    'pontaPointInput', 'pontaPointInvestInput', 'paypayPointInvestInput'
  ];

  const CATEGORY_COLORS = ['#10b981', '#6366f1', '#f59e0b', '#ec4899'];
  const CATEGORY_LABELS = ['現金', '証券', '暗号資産', 'ポイント'];

  window.onload = () => {
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    initCharts();
    updateUI();
  };

  function addRecord() {
    const date = document.getElementById('dateInput').value;
    if (!date) {
      alert('日付を選択してください');
      return;
    }

    const values = {};
    INPUT_IDS.forEach(id => {
      const key = id.replace('Input', '');
      values[key] = Number(document.getElementById(id).value) || 0;
    });

    const cashTotal = values.cash + values.morimori;
    const secTotal = values.ideco + values.paypay + values.monex + values.mufg + values.otherSec;
    const cryptoTotal = values.btcMercari + values.btcBitpoint;
    const pointTotal = values.dPoint + values.dPointInvest + values.vPoint + values.vPointInvest +
                       values.rakutenLimited + values.pontaPoint + values.pontaPointInvest + values.paypayPointInvest;

    const total = cashTotal + secTotal + cryptoTotal + pointTotal;

    const recordData = {
      id: Date.now(),
      date,
      categoryTotals: [cashTotal, secTotal, cryptoTotal, pointTotal],
      details: values,
      total
    };

    // 同一日のデータがあれば上書き、なければ新規追加
    const existingIndex = records.findIndex(r => r.date === date);
    if (existingIndex !== -1) {
      recordData.id = records[existingIndex].id; // 既存IDを維持
      records[existingIndex] = recordData;
    } else {
      records.push(recordData);
    }

    records.sort((a, b) => new Date(a.date) - new Date(b.date));
    localStorage.setItem('family_money_records', JSON.stringify(records));

    // 入力欄のリセット
    INPUT_IDS.forEach(id => {
      document.getElementById(id).value = '';
    });

    updateUI();
  }

  function deleteRecord(id) {
    if (!confirm('この記録を削除してもよろしいですか？')) return;
    records = records.filter(r => r.id !== id);
    localStorage.setItem('family_money_records', JSON.stringify(records));
    updateUI();
  }

  function loadRecordToForm(id) {
    const record = records.find(r => r.id === id);
    if (!record) return;

    document.getElementById('dateInput').value = record.date;
    INPUT_IDS.forEach(idStr => {
      const key = idStr.replace('Input', '');
      document.getElementById(idStr).value = record.details[key] || '';
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function updateUI() {
    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '';

    if (records.length === 0) {
      document.getElementById('totalBalance').innerText = '¥0';
      updatePieChart([0, 0, 0, 0]);
      updateLineChart([], []);
      return;
    }

    const latest = records[records.length - 1];
    document.getElementById('totalBalance').innerText = '¥' + latest.total.toLocaleString();

    [...records].reverse().forEach(r => {
      const li = document.createElement('li');
      li.className = 'history-item';

      const catSum = r.categoryTotals || [0, 0, 0, 0];
      const detailsText = `現金:¥${(catSum[0]||0).toLocaleString()} / 証券:¥${(catSum[1]||0).toLocaleString()} / 暗号:¥${(catSum[2]||0).toLocaleString()} / pt:¥${(catSum[3]||0).toLocaleString()}`;

      li.innerHTML = `
        <div class="history-header">
          <span class="history-date">📅 ${r.date}</span>
          <div>
            <span class="history-amount">¥${r.total.toLocaleString()}</span>
            <button class="action-btn edit-btn" onclick="loadRecordToForm(${r.id})">編集</button>
            <button class="action-btn del-btn" onclick="deleteRecord(${r.id})">削除</button>
          </div>
        </div>
        <div class="history-details">${detailsText}</div>
      `;
      historyList.appendChild(li);
    });

    updatePieChart(latest.categoryTotals);
    updateLineChart(records.map(r => r.date), records.map(r => r.total));
  }

  function initCharts() {
    const ctxPie = document.getElementById('pieChart').getContext('2d');
    pieChart = new Chart(ctxPie, {
      type: 'doughnut',
      data: {
        labels: CATEGORY_LABELS,
        datasets: [{
          data: [0, 0, 0, 0],
          backgroundColor: CATEGORY_COLORS
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 14, font: { size: 12 } } }
        }
      }
    });

    const ctxLine = document.getElementById('lineChart').getContext('2d');
    lineChart = new Chart(ctxLine, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: '総資産額',
          data: [],
          borderColor: '#2563eb',
          backgroundColor: 'rgba(37, 99, 235, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: false }
        }
      }
    });
  }

  function updatePieChart(categoryData) {
    pieChart.data.datasets[0].data = categoryData;
    pieChart.update();
  }

  function updateLineChart(labels, data) {
    lineChart.data.labels = labels;
    lineChart.data.datasets[0].data = data;
    lineChart.update();
  }
</script>

</body>
</html>

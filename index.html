<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファミリー資産管理</title>
  <!-- グラフ描画ライブラリ Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text-main: #0f172a;
      --text-sub: #64748b;
    }
    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .title {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 4px;
      text-align: center;
      font-weight: 600;
    }
    .total-balance {
      font-size: 32px;
      font-weight: bold;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 16px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .input-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .input-row label {
      font-size: 13px;
      font-weight: bold;
      color: #334155;
      width: 140px;
      white-space: nowrap;
    }
    .input-row input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      text-align: right;
      outline: none;
      width: 100%;
    }
    .input-row input:focus {
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .chart-box {
      position: relative;
      width: 100%;
      height: 240px;
      margin-top: 10px;
    }
    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 220px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      flex-direction: column;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .history-date { color: var(--text-sub); font-weight: 500; }
    .history-amount { font-weight: bold; color: var(--text-main); font-size: 15px; }
    .history-details {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
    }
    .del-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 入力・最新残高エリア -->
  <div class="card">
    <div class="title">総資産残高</div>
    <div class="total-balance" id="totalBalance">¥0</div>

    <div class="input-group">
      <div class="input-row">
        <label style="color: #10b981;">💵 現金</label>
        <input type="number" id="cashInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #059669;">🏢 モリモリ買取</label>
        <input type="number" id="morimoriInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #6366f1;">🌱 iDeCo</label>
        <input type="number" id="idecoInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #ef4444;">📱 PayPay証券</label>
        <input type="number" id="paypayInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #f59e0b;">📈 マネックス証券</label>
        <input type="number" id="monexInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row">
        <label style="color: #8b5cf6;">🏦 三菱UFJ eスマ証券</label>
        <input type="number" id="mufgInput" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-row" style="margin-top: 6px;">
        <label>📅 入力日</label>
        <input type="date" id="dateInput">
      </div>
    </div>

    <button class="btn" onclick="addRecord()">記録を保存・更新</button>
  </div>

  <!-- 割合グラフ（円グラフ） -->
  <div class="card">
    <div class="title">資産内訳（割合）</div>
    <div class="chart-box">
      <canvas id="pieChart"></canvas>
    </div>
  </div>

  <!-- 推移グラフ（折れ線グラフ） -->
  <div class="card">
    <div class="title">総資産推移</div>
    <div class="chart-box">
      <canvas id="lineChart"></canvas>
    </div>
  </div>

  <!-- 履歴一覧 -->
  <div class="card">
    <div class="title" style="margin-bottom: 12px;">入力履歴</div>
    <ul class="history-list" id="historyList"></ul>
  </div>
</div>

<script>
  let records = JSON.parse(localStorage.getItem('family_money_records') || '[]');
  let pieChart, lineChart;

  const ITEM_COLORS = ['#10b981', '#059669', '#6366f1', '#ef4444', '#f59e0b', '#8b5cf6'];
  const ITEM_LABELS = ['現金', 'モリモリ買取', 'iDeCo', 'PayPay証券', 'マネックス証券', '三菱UFJ eスマ証券'];

  window.onload = () => {
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    initCharts();
    updateUI();
  };

  function addRecord() {
    const cash = Number(document.getElementById('cashInput').value) || 0;
    const morimori = Number(document.getElementById('morimoriInput').value) || 0;
    const ideco = Number(document.getElementById('idecoInput').value) || 0;
    const paypay = Number(document.getElementById('paypayInput').value) || 0;
    const monex = Number(document.getElementById('monexInput').value) || 0;
    const mufg = Number(document.getElementById('mufgInput').value) || 0;
    const date = document.getElementById('dateInput').value;

    if (!date) {
      alert('日付を選択してください');
      return;
    }

    const total = cash + morimori + ideco + paypay + monex + mufg;
    const newRecord = {
      id: Date.now(),
      date,
      items: [cash, morimori, ideco, paypay, monex, mufg],
      total
    };

    records.push(newRecord);
    records.sort((a, b) => new Date(a.date) - new Date(b.date));

    localStorage.setItem('family_money_records', JSON.stringify(records));

    // 入力欄リセット
    ['cashInput', 'morimoriInput', 'idecoInput', 'paypayInput', 'monexInput', 'mufgInput'].forEach(id => {
      document.getElementById(id).value = '';
    });

    updateUI();
  }

  function deleteRecord(id) {
    records = records.filter(r => r.id !== id);
    localStorage.setItem('family_money_records', JSON.stringify(records));
    updateUI();
  }

  function updateUI() {
    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '';

    if (records.length === 0) {
      document.getElementById('totalBalance').innerText = '¥0';
      updatePieChart([0, 0, 0, 0, 0, 0]);
      updateLineChart([], []);
      return;
    }

    const latest = records[records.length - 1];
    document.getElementById('totalBalance').innerText = '¥' + latest.total.toLocaleString();

    [...records].reverse().forEach(r => {
      const li = document.createElement('li');
      li.className = 'history-item';

      const detailsText = ITEM_LABELS.map((label, idx) => {
        const val = r.items[idx] || 0;
        return val > 0 ? `${label}: ¥${val.toLocaleString()}` : null;
      }).filter(Boolean).join(' / ');

      li.innerHTML = `
        <div class="history-header">
          <span class="history-date">📅 ${r.date}</span>
          <div>
            <span class="history-amount">¥${r.total.toLocaleString()}</span>
            <button class="del-btn" onclick="deleteRecord(${r.id})">削除</button>
          </div>
        </div>
        <div class="history-details">${detailsText || '内訳なし'}</div>
      `;
      historyList.appendChild(li);
    });

    updatePieChart(latest.items);
    updateLineChart(records.map(r => r.date), records.map(r => r.total));
  }

  function initCharts() {
    const ctxPie = document.getElementById('pieChart').getContext('2d');
    pieChart = new Chart(ctxPie, {
      type: 'doughnut',
      data: {
        labels: ITEM_LABELS,
        datasets: [{
          data: [0, 0, 0, 0, 0, 0],
          backgroundColor: ITEM_COLORS
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
        }
      }
    });

    const ctxLine = document.getElementById('lineChart').getContext('2d');
    lineChart = new Chart(ctxLine, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: '総資産額',
          data: [],
          borderColor: '#2563eb',
          backgroundColor: 'rgba(37, 99, 235, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: false }
        }
      }
    });
  }

  function updatePieChart(itemData) {
    pieChart.data.datasets[0].data = itemData;
    pieChart.update();
  }

  function updateLineChart(labels, data) {
    lineChart.data.labels = labels;
    lineChart.data.datasets[0].data = data;
    lineChart.update();
  }
</script>

</body>
</html>
